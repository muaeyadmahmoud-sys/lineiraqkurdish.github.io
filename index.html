<title>LINE IRAQ | بەرهەمەکانی لاین</title>
<style>
:root{--navy:#071b46;--navy2:#0d2f6f;--gold:#d19a1b;--cream:#f7f2e6;--text:#17213b;--muted:#667085}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#fff,var(--cream))}
.hero{min-height:75vh;display:grid;place-items:center;padding:48px 20px;color:#fff;text-align:center;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.14),transparent 30%),linear-gradient(135deg,var(--navy),var(--navy2));position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:520px;height:520px;border:82px solid rgba(209,154,27,.13);border-radius:50%;left:-250px;bottom:-300px}
.hero-inner{width:min(1100px,100%);position:relative;z-index:1}
.brand{display:inline-block;padding:9px 18px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.08);font-weight:800}
h1{margin:22px 0 12px;font-size:clamp(42px,9vw,82px);line-height:1}
.lead{margin:0 auto 30px;max-width:700px;color:#f2e5bd;font-size:clamp(18px,3vw,26px);line-height:1.8}
.cta{display:inline-block;color:var(--navy);background:var(--gold);text-decoration:none;padding:14px 24px;border-radius:14px;font-weight:800}
section{width:min(1100px,100%);margin:auto;padding:68px 20px}
.title{text-align:center;margin-bottom:30px}.title h2{margin:0 0 10px;color:var(--navy);font-size:clamp(30px,5vw,48px)}.title p{margin:0;color:var(--muted);font-size:17px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{background:#fff;border:1px solid #e8e0cf;border-radius:26px;overflow:hidden;box-shadow:0 18px 44px rgba(17,37,75,.10)}
.visual{height:470px;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#fff,#faf7ef)}
.visual img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(0,0,0,.20))}
.content{padding:22px 22px 26px}.tag{display:inline-block;padding:7px 11px;border-radius:999px;background:#f3e7c9;color:#7d5908;font-size:12px;font-weight:800}
.content h3{margin:14px 0 8px;color:var(--navy);font-size:24px}.content p{margin:0;color:var(--muted);line-height:1.9}
.contact{width:100%;max-width:none;background:var(--navy);color:#fff;text-align:center;padding:58px 20px}.contact h2{margin:0 0 10px;font-size:36px}.contact p{margin:0;color:#dfe7f7;line-height:1.8}
footer{text-align:center;background:#04112d;color:#bac7df;padding:18px;font-size:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.visual{height:390px}}
</style>
</head>
